name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and unit test
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Integration tests (Kafka + MongoDB via Testcontainers)
        run: |
          set -o pipefail
          ./gradlew integrationTest --no-daemon --stacktrace 2>&1 | tee integration.log

      - name: Surface failures as annotations
        if: failure()
        run: |
          for f in build.log integration.log; do
            [ -f "$f" ] || continue
            grep -nE "error:|FAILED|What went wrong|Caused by|Expected|expected:|but was|Exception" "$f" \
              | head -60 > "$f.summary" || true
            body=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$f.summary")
            [ -n "$body" ] && echo "::error title=$f::$body"
          done
          true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests
            build/reports/jacoco/test/html
          if-no-files-found: ignore

      - name: Build Docker image
        run: docker build -t eventstream-platform:ci .
